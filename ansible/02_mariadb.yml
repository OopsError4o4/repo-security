---
# ============================================================
# 02_mariadb.yml
# Richtet die MariaDB-Datenbank für repo-security ein
# ============================================================

- name: Setup MariaDB
  hosts: repo_security
  become: true

  tasks:

    - name: Create repo_security database
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Create repo_security user
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        priv: "{{ db_name }}.*:ALL"
        host: localhost
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Flush privileges
      community.mysql.mysql_query:
        query: FLUSH PRIVILEGES
        login_unix_socket: /var/lib/mysql/mysql.sock