---
# ============================================================
# 05_proxy.yml
# Konfiguriert den Proxy in der Repomanager SQLite-DB
# ============================================================

- name: Configure Repomanager proxy settings
  hosts: repomanager
  become: true

  vars:
    repomanager_sqlite_db: "/var/lib/containers/storage/volumes/repomanager_repomanager-data/_data/db/repomanager.db"

  tasks:

    - name: Install sqlite
      ansible.builtin.dnf:
        name: sqlite
        state: present

    - name: Set proxy in Repomanager SQLite database
      ansible.builtin.shell:
        cmd: >
          sqlite3 {{ repomanager_sqlite_db }}
          "UPDATE settings SET PROXY='{{ http_proxy }}';"
      when: http_proxy is defined and http_proxy != ""
      changed_when: true

    - name: Clear proxy in Repomanager SQLite database
      ansible.builtin.shell:
        cmd: >
          sqlite3 {{ repomanager_sqlite_db }}
          "UPDATE settings SET PROXY='';"
      when: http_proxy is not defined or http_proxy == ""
      changed_when: true

    - name: Verify proxy setting
      ansible.builtin.shell:
        cmd: >
          sqlite3 {{ repomanager_sqlite_db }}
          "SELECT PROXY FROM settings;"
      register: proxy_check
      changed_when: false

    - name: Show proxy setting
      ansible.builtin.debug:
        msg: "Repomanager Proxy gesetzt auf: {{ proxy_check.stdout }}"