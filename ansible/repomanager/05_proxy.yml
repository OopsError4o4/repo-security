---
# ============================================================
# 05_proxy.yml
# Konfiguriert den Proxy in den Repomanager-Settings via API
# ============================================================

- name: Configure Repomanager proxy settings
  hosts: repomanager
  become: true

  tasks:

    - name: Wait for Repomanager to be ready
      ansible.builtin.uri:
        url: "http://localhost:{{ repomanager_port }}/login"
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 5

    - name: Login to Repomanager and get session cookie
      ansible.builtin.uri:
        url: "http://localhost:{{ repomanager_port }}/login"
        method: POST
        body_format: form-urlencoded
        body:
          authType: local
          username: "{{ repomanager_admin_user }}"
          password: "{{ repomanager_admin_pass }}"
        follow_redirects: all
        status_code: 200
      register: login_result

    - name: Set proxy in Repomanager settings
      ansible.builtin.uri:
        url: "http://localhost:{{ repomanager_port }}/ajax/controller.php"
        method: POST
        headers:
          Cookie: "{{ login_result.cookies_string }}"
          X-Requested-With: XMLHttpRequest
        body_format: form-urlencoded
        body:
          controller: general
          action: settings
          type: proxy
          proxy: "{{ http_proxy }}"
        status_code: 200
      when: http_proxy is defined and http_proxy != ""

    - name: Clear proxy in Repomanager settings
      ansible.builtin.uri:
        url: "http://localhost:{{ repomanager_port }}/ajax/controller.php"
        method: POST
        headers:
          Cookie: "{{ login_result.cookies_string }}"
          X-Requested-With: XMLHttpRequest
        body_format: form-urlencoded
        body:
          controller: general
          action: settings
          type: proxy
          proxy: ""
        status_code: 200
      when: http_proxy is not defined or http_proxy == ""